---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TARGET_REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --no-tags --depth=1 origin "$TARGET_REF"
          git checkout --detach FETCH_HEAD

      - name: Install validation tools
        env:
          TOOLCHAIN_COMMIT: 2770daacbe75168cc340293704209b28230313aa
          TOOLCHAIN_URL: https://github.com/asphyx0r/coding-agent-toolchain.git
        run: |
          TOOLCHAIN_DIR="$RUNNER_TEMP/coding-agent-toolchain"
          git init "$TOOLCHAIN_DIR"
          git -C "$TOOLCHAIN_DIR" remote add origin "$TOOLCHAIN_URL"
          git -C "$TOOLCHAIN_DIR" fetch --depth=1 origin "$TOOLCHAIN_COMMIT"
          git -C "$TOOLCHAIN_DIR" checkout --detach FETCH_HEAD
          "$TOOLCHAIN_DIR/scripts/install-tools.sh" \
            -c "$TOOLCHAIN_DIR/config/tools.yaml"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run validation
        run: |
          markdownlint-cli2 "**/*.md"
          yamllint .markdownlint-cli2.yaml .github/workflows/ci.yml
          node --check commitlint.config.cjs
          commitlint --print-config json --config commitlint.config.cjs
          actionlint
          betterleaks git --no-banner --redact

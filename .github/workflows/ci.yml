---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$REPOSITORY_URL"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pull_ref="refs/pull/$PULL_REQUEST_NUMBER/head"
            pull_remote="refs/remotes/origin/pull/$PULL_REQUEST_NUMBER/head"
            git fetch --no-tags --depth=100 origin \
              "$BASE_SHA" \
              "$pull_ref:$pull_remote"
            git checkout --detach "$pull_remote"
          else
            git fetch --no-tags --depth=100 origin "$TARGET_REF"
            git checkout --detach FETCH_HEAD
          fi

      - name: Install validation tools
        env:
          # coding-agent-toolchain v1.4.1
          TOOLCHAIN_COMMIT: 2770daacbe75168cc340293704209b28230313aa
          TOOLCHAIN_URL: https://github.com/asphyx0r/coding-agent-toolchain.git
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="$RUNNER_TEMP/coding-agent-toolchain"
          git init "$TOOLCHAIN_DIR"
          git -C "$TOOLCHAIN_DIR" remote add origin "$TOOLCHAIN_URL"
          git -C "$TOOLCHAIN_DIR" fetch --depth=1 origin "$TOOLCHAIN_COMMIT"
          git -C "$TOOLCHAIN_DIR" checkout --detach FETCH_HEAD
          # actionlint is pinned separately from the toolchain installer so
          # workflow syntax validation stays explicit and reviewable.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          export PATH="$HOME/go/bin:$PATH"
          bash "$TOOLCHAIN_DIR/scripts/install-tools.sh" \
            -c "$TOOLCHAIN_DIR/config/tools.yaml"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          ZERO_SHA: '0000000000000000000000000000000000000000'
        run: |
          set -euo pipefail
          validate_commit_messages() {
            local from_ref=''

            if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" ]] &&
              git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              from_ref="$BASE_SHA"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$ZERO_SHA" ]] &&
              git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              from_ref="$BEFORE_SHA"
            fi

            if [[ -n "$from_ref" ]]; then
              commitlint --from "$from_ref" --to HEAD \
                --config commitlint.config.cjs
            else
              git log -1 --format=%B | commitlint --config commitlint.config.cjs
            fi
          }

          git fsck --full
          markdownlint-cli2 "**/*.md"
          yamllint .markdownlint-cli2.yaml .github/workflows/ci.yml
          node --check commitlint.config.cjs
          commitlint --print-config json --config commitlint.config.cjs
          validate_commit_messages
          bash -n .githooks/pre-commit
          bash -n .githooks/commit-msg
          shellcheck .githooks/pre-commit .githooks/commit-msg
          shfmt -d -i 2 .githooks/pre-commit .githooks/commit-msg
          actionlint
          ruff check tools/agent-rules-sync.py tests/test_agent_rules_sync.py
          python -B -m unittest discover \
            -s tests \
            -p 'test_agent_rules_sync.py' \
            -v
          betterleaks git --no-banner --redact
